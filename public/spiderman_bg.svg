<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="skyGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1a0814" />
      <stop offset="40%" stop-color="#090514" />
      <stop offset="100%" stop-color="#02020a" />
    </radialGradient>

    <radialGradient id="moonGlow" cx="65%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="suitRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a40" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <linearGradient id="suitBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c2340" />
    </linearGradient>

    <filter id="spiderGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Night Sky -->
  <rect width="1920" height="1080" fill="url(#skyGlow)" />

  <!-- Volumetric Ambient Spidey Atmosphere -->
  <circle cx="1200" cy="400" r="600" fill="url(#moonGlow)" />

  <!-- Giant Cyber Web Network in Sky -->
  <g opacity="0.12" stroke="#ef4444" stroke-width="1.5" fill="none">
    <line x1="1250" y1="380" x2="0" y2="0" />
    <line x1="1250" y1="380" x2="600" y2="0" />
    <line x1="1250" y1="380" x2="1200" y2="0" />
    <line x1="1250" y1="380" x2="1800" y2="0" />
    <line x1="1250" y1="380" x2="1920" y2="400" />
    <line x1="1250" y1="380" x2="1920" y2="900" />
    <line x1="1250" y1="380" x2="1400" y2="1080" />
    <line x1="1250" y1="380" x2="700" y2="1080" />
    <line x1="1250" y1="380" x2="0" y2="800" />

    <circle cx="1250" cy="380" r="140" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="8 4" />
    <circle cx="1250" cy="380" r="280" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="10 5" />
    <circle cx="1250" cy="380" r="440" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="12 6" />
    <circle cx="1250" cy="380" r="620" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="16 8" />
  </g>

  <!-- Distant City Skyscrapers Silhouette -->
  <g opacity="0.35">
    <rect x="200" y="550" width="90" height="530" fill="#060614" stroke="rgba(56,189,248,0.15)" stroke-width="1" />
    <rect x="310" y="480" width="130" height="600" fill="#040410" stroke="rgba(239,68,68,0.15)" stroke-width="1" />
    <rect x="460" y="580" width="110" height="500" fill="#070716" stroke="rgba(56,189,248,0.15)" stroke-width="1" />
    <rect x="600" y="420" width="150" height="660" fill="#050512" stroke="rgba(239,68,68,0.15)" stroke-width="1" />
    <rect x="770" y="520" width="120" height="560" fill="#060614" stroke="rgba(56,189,248,0.15)" stroke-width="1" />
    <rect x="910" y="460" width="140" height="620" fill="#040410" stroke="rgba(56,189,248,0.15)" stroke-width="1" />
    <rect x="1500" y="500" width="160" height="580" fill="#060614" stroke="rgba(239,68,68,0.15)" stroke-width="1" />
    <rect x="1680" y="440" width="130" height="640" fill="#050512" stroke="rgba(56,189,248,0.15)" stroke-width="1" />
    <rect x="1830" y="540" width="90" height="540" fill="#070716" stroke="rgba(56,189,248,0.15)" stroke-width="1" />
  </g>

  <!-- Glowing City Window Dots -->
  <g fill="#38bdf8" opacity="0.25">
    <circle cx="230" cy="620" r="1.5" /><circle cx="260" cy="650" r="1.5" /><circle cx="240" cy="720" r="1.5" />
    <circle cx="340" cy="540" r="1.5" /><circle cx="380" cy="600" r="1.5" /><circle cx="410" cy="660" r="1.5" />
    <circle cx="630" cy="480" r="1.5" /><circle cx="670" cy="530" r="1.5" /><circle cx="710" cy="590" r="1.5" />
    <circle cx="940" cy="520" r="1.5" /><circle cx="980" cy="580" r="1.5" /><circle cx="1020" cy="640" r="1.5" />
    <circle cx="1540" cy="560" r="1.5" /><circle cx="1600" cy="620" r="1.5" /><circle cx="1720" cy="510" r="1.5" />
  </g>

  <!-- High-Tech Skyscraper Rooftop Spire (Foreground Perch) -->
  <g>
    <!-- Gargoyle / Futuristic Building Ledge -->
    <path d="M 980 1080 L 1150 560 L 1320 560 L 1480 1080 Z" fill="#05040d" stroke="rgba(239,68,68,0.4)" stroke-width="2" />
    <line x1="1150" y1="560" x2="1320" y2="560" stroke="#ef4444" stroke-width="3" filter="url(#spiderGlow)" />
    <!-- Spire Needle -->
    <polygon points="1235,560 1240,430 1245,560" fill="#080718" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- ════════════════════════════════════════════════════════════
       DYNAMIC CROUCHING SPIDER-MAN HERO FIGURE (Cinematic Silhouette & Glow)
       ════════════════════════════════════════════════════════════ -->
  <g transform="translate(1120, 240) scale(0.95)">
    <!-- Ambient Spidey Neon Back-Aura -->
    <ellipse cx="140" cy="180" rx="140" ry="120" fill="url(#suitRed)" opacity="0.18" filter="url(#spiderGlow)" />

    <!-- Spider-Man Body Torso & Suit -->
    <!-- Back & Spine -->
    <path
      d="M 120 120 C 80 100 50 140 60 190 C 70 230 100 250 140 260 C 180 260 210 230 210 190 C 210 140 170 110 120 120 Z"
      fill="url(#suitRed)"
      stroke="#100308"
      stroke-width="3"
    />

    <!-- Suit Blue Side Panels (Abdomen & Lat muscles) -->
    <path d="M 80 160 C 75 190 85 220 110 240 C 95 210 90 180 80 160 Z" fill="url(#suitBlue)" />
    <path d="M 170 160 C 185 180 185 210 170 240 C 185 220 190 190 170 160 Z" fill="url(#suitBlue)" />

    <!-- Chest Spider Icon (Black & Red) -->
    <g transform="translate(125, 175) scale(0.8)">
      <ellipse cx="15" cy="20" rx="6" ry="10" fill="#05050d" />
      <!-- Legs Top -->
      <path d="M 12 15 Q 0 5 -10 12 M 18 15 Q 30 5 40 12" stroke="#05050d" stroke-width="2.5" fill="none" />
      <path d="M 12 18 Q -5 18 -15 28 M 18 18 Q 35 18 45 28" stroke="#05050d" stroke-width="2.5" fill="none" />
      <!-- Legs Bottom -->
      <path d="M 13 24 Q 0 35 -8 45 M 17 24 Q 30 35 38 45" stroke="#05050d" stroke-width="2.5" fill="none" />
      <path d="M 14 26 Q 5 42 0 52 M 16 26 Q 25 42 30 52" stroke="#05050d" stroke-width="2.5" fill="none" />
    </g>

    <!-- Spider-Man Head (Mask tilted down, focused) -->
    <path
      d="M 140 70 C 105 70 85 95 90 125 C 95 155 125 175 140 175 C 155 175 185 155 190 125 C 195 95 175 70 140 70 Z"
      fill="url(#suitRed)"
      stroke="#18040a"
      stroke-width="3"
    />

    <!-- Mask Webbing Lines (Radial Web Lattice) -->
    <g stroke="#0f0206" stroke-width="1.2" opacity="0.65" fill="none">
      <line x1="140" y1="120" x2="140" y2="70" />
      <line x1="140" y1="120" x2="105" y2="85" />
      <line x1="140" y1="120" x2="90" y2="115" />
      <line x1="140" y1="120" x2="100" y2="150" />
      <line x1="140" y1="120" x2="140" y2="175" />
      <line x1="140" y1="120" x2="180" y2="150" />
      <line x1="140" y1="120" x2="190" y2="115" />
      <line x1="140" y1="120" x2="175" y2="85" />

      <path d="M 120 95 Q 140 90 160 95" />
      <path d="M 105 115 Q 140 110 175 115" />
      <path d="M 115 145 Q 140 150 165 145" />
    </g>

    <!-- Iconic Glowing Spider-Man Eyes (White Glowing Lenses with Sharp Black Rims) -->
    <!-- Left Eye -->
    <path
      d="M 100 115 C 112 110 130 116 135 125 C 128 136 108 138 98 128 C 96 122 97 117 100 115 Z"
      fill="#ffffff"
      stroke="#090514"
      stroke-width="4.5"
      filter="url(#eyeGlow)"
    />
    <!-- Right Eye -->
    <path
      d="M 180 115 C 168 110 150 116 145 125 C 152 136 172 138 182 128 C 184 122 183 117 180 115 Z"
      fill="#ffffff"
      stroke="#090514"
      stroke-width="4.5"
      filter="url(#eyeGlow)"
    />

    <!-- Crouching Legs (Agile pose gripping building) -->
    <!-- Left Knee & Thigh -->
    <path
      d="M 70 190 C 30 180 0 210 10 250 C 20 280 60 290 85 270 C 100 255 90 220 70 190 Z"
      fill="url(#suitBlue)"
      stroke="#100308"
      stroke-width="2.5"
    />
    <!-- Left Foot (Red Boot gripping ledge) -->
    <path d="M 15 260 C 0 270 -5 290 20 300 C 45 305 60 290 45 275 Z" fill="url(#suitRed)" />

    <!-- Right Knee & Thigh (Raised dynamic crouch) -->
    <path
      d="M 200 190 C 240 170 280 200 275 240 C 270 275 230 290 200 270 C 185 255 190 220 200 190 Z"
      fill="url(#suitBlue)"
      stroke="#100308"
      stroke-width="2.5"
    />
    <!-- Right Foot (Red Boot) -->
    <path d="M 260 255 C 280 265 290 285 265 300 C 240 305 230 285 245 270 Z" fill="url(#suitRed)" />

    <!-- Arm 1 (Reaching down to touch building) -->
    <path
      d="M 65 140 C 40 160 25 195 30 230 C 35 245 45 245 50 230 C 55 195 70 165 85 145 Z"
      fill="url(#suitRed)"
    />

    <!-- Arm 2 (Extended Web Shooter pose pointing towards screen) -->
    <path
      d="M 190 140 C 220 150 255 165 285 180 C 295 185 300 175 290 168 C 260 150 225 135 195 130 Z"
      fill="url(#suitRed)"
    />

    <!-- Glowing Web Shooter Blast Line Shooting Outward -->
    <line x1="290" y1="175" x2="-800" y2="400" stroke="#ffffff" stroke-width="2.5" filter="url(#spiderGlow)" opacity="0.85" />
    <line x1="290" y1="175" x2="-800" y2="400" stroke="#38bdf8" stroke-width="6" opacity="0.4" filter="url(#spiderGlow)" />
    <!-- Web Splat particles at Shooter Nozzle -->
    <circle cx="290" cy="175" r="5" fill="#ffffff" filter="url(#eyeGlow)" />
    <circle cx="290" cy="175" r="12" fill="none" stroke="#ef4444" stroke-width="1.5" />
  </g>

  <!-- Bottom Fog / Shadow Vignette to blend with website background -->
  <rect x="0" y="700" width="1920" height="380" fill="url(#skyGlow)" opacity="0.9" />
</svg>
